# AMtown camera preset; explicit assumptions and public source are recorded below.
base_config: config/config.yaml
Projection:
  intrinsics_source: calibration
  camera_matrix:
  - 1453.72
  - 0.0
  - 1172.18
  - 0.0
  - 1453.28
  - 1041.78
  - 0.0
  - 0.0
  - 1.0
  camera_image_size:
  - 2448
  - 2048
  distortion:
  - -0.121
  - 0.1113
  - 0.0016
  - 0.00013
  - -0.062353
  images_undistorted: false
  preprocess_mode: crop
  time_tolerance_s: 0.06
  motion_compensation: true
  min_depth_m: 0.1
  max_depth_m: 300.0
  confidence_percentile: 25.0
  min_confidence: null  # auto: 0.75 for VGGT/Omega, 0.1 for Pi3
  max_relative_depth_jump: 0.05
  max_pairs_per_frame: 2000
  validation_fraction: 0.2
  ransac_threshold_m: 2.0
  ransac_max_iterations: 5000
  ransac_confidence: 0.999
  ransac_min_inliers: 100
  ransac_min_inlier_ratio: 0.1
  ransac_scoring_points: 10000
  min_inlier_frames: 3
  export_confidence: null  # auto: model-specific confidence scale
  export_sample_ratio: 0.05
  seed: 0
  allow_intrinsics_rescale: true
  calibration_source: https://github.com/sijieaaa/UAVScenes/blob/main/calibration_results.py
  calibration_note: Public AMtown camera intrinsics/distortion; local R/t retained
    from base config. Raw resized-image assumption inferred from tools/downsample.py;
    confirm for your data.
