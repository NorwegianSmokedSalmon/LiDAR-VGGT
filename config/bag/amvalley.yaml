# AMvalley: inspect all 10 Hz frames to retain overlap over nearby terrain.
image_topic: /left_camera/image/compressed
height_topic: /dji_osdk_ros/height_above_takeoff
image_time_offset_s: -0.1
camera_image_size:
- 2448
- 2048
images_undistorted: false
fastlio_config: config/bag/fastlio_amvalley.yaml
takeoff:
  min_height: 60.0
  cruise_fraction: 0.5
  max_climb_speed: 1.0
  stable_seconds: 3.0
selection:
  tracking_width: 640
  parallax_px: 12.0
  min_tracks: 60
  min_track_ratio: 0.25
  min_baseline_m: 0.5
  max_features: 800
  candidate_interval_s: 0.08
sources:
  intrinsics: https://github.com/sijieaaa/UAVScenes/blob/main/calibration_results.py
  extrinsics_and_timing: https://github.com/hku-mars/FAST-LIVO2/blob/main/config/MARS_LVIG.yaml
  intrinsics_calibration: AMvalley_calibration
