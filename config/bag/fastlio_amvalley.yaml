# AMvalley begins with empty and sparse scans. Wait for a populated initial map.
common:
  lid_topic: /livox/lidar
  imu_topic: /livox/imu
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0
preprocess:
  lidar_type: 1
  scan_line: 6
  blind: 0.8
mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 90.0
  det_range: 450.0
  extrinsic_est_en: false
  extrinsic_T:
  - 0.04165
  - 0.02326
  - -0.0284
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  min_initial_map_points: 200
publish:
  path_en: false
  scan_publish_en: false
  dense_publish_en: true
  scan_bodyframe_pub_en: false
pcd_save:
  pcd_save_en: false
  interval: -1
feature_extract_enable: false
point_filter_num: 3
max_iteration: 3
filter_size_surf: 0.5
filter_size_map: 0.5
cube_side_length: 1000.0
runtime_pos_log_enable: false
lemon_export:
  period: 0.05
  voxel_size: 0.0
  level_world: true
  body_from_imu:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
